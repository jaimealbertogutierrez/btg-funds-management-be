# ************************************************************

AWSTemplateFormatVersion: '2010-09-09'
Description: 'Despliegue del Microservicio BTG Funds - Jaime Gutierrez'

Resources:

  # ************************************************************
  # Instancia EC2 propuesta para ejecutar el microservicio
  # ************************************************************
  BTGEC2Instance:
    Type: 'AWS::EC2::Instance'
    Properties:
      # Tipo de instancia ligera para pruebas
      InstanceType: t2.micro
      # Imagen base: Amazon Linux 2 (ID varía según región)
      ImageId: ami-0c55b159cbfafe1f0
      SecurityGroups:
        - !Ref WebServerSecurityGroup
      Tags:
        - Key: Name
          Value: BTG-Funds-Backend
      UserData:
        # Script de inicialización de la instancia
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          amazon-linux-extras install docker -y
          service docker start
          # NOTA:
          # Aquí se descargaría la imagen Docker construida localmente
          # y se correría con:
          # docker run -d -p 8080:8080 tu-usuario/btg-funds-service
          # Esto demuestra que el microservicio está listo para un despliegue
          # en nube sin requerir herramientas o licencias adicionales.

  # ************************************************************
  # Grupo de seguridad para habilitar acceso HTTP al microservicio
  # ************************************************************
  WebServerSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Enable HTTP access via port 8080
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

