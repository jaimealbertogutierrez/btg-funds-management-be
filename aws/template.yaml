# Plantilla AWS CloudFormation para despliegue del Microservicio BTG Funds
#
# PROPÓSITO:
# ----------
# Esta plantilla representa la propuesta de empaquetado y despliegue en la nube
# (AWS EC2) del microservicio BTG Funds. Se incluye para demostrar preparación
# para migración y despliegue en un entorno de producción real.
#
# NOTA IMPORTANTE:
# ----------------
# - La prueba técnica actual no exige despliegue en la nube ni uso de licencias.
# - Se ha preparado el empaquetado local mediante Docker para entregar la app
#   al proceso de evaluación técnica.
# - Esta plantilla sirve como guía para migración futura a AWS.
#
# AUTOR:
# ------
# Jaime Alberto Gutierrez Mejia
# Analista Programador Java
# CC: 9733675
